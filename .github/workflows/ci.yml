name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_KEY: ci-placeholder-not-a-real-secret
          SUPABASE_STORAGE_BUCKET: astro
          ADMIN_PASSWORD: ci-placeholder-password
          ADMIN_SESSION_SECRET: ci-placeholder-secret-at-least-32-characters
