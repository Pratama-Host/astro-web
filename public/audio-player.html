<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Player</title>
  </head>
  <body>
    <audio id="bg-audio" preload="none" loop>
      <!-- Source audio diatur melalui JavaScript setelah konfigurasi dimuat. -->

      Your browser does not support the audio element.
    </audio>

    <script>
      const STORAGE_ENABLED = "tkj-audio-enabled";
      const STORAGE_VOLUME = "tkj-audio-volume";
      const STORAGE_TIME = "tkj-audio-current-time";
      const audio = document.getElementById("bg-audio");
      let configuredDefaultVolume = 0.8;
      let configuredAudioSource = null;
      let audioSettingsLoaded = false;
      let playRequested = false;
      let playRequestPending = false;
      let pendingPlayAfterInteraction = false;
      // Konfigurasi ringan boleh dibaca lebih awal; file audio baru diminta saat benar-benar diaktifkan.
      fetch("/api/public/settings", { credentials: "same-origin" })
        .then((response) => response.ok ? response.json() : null)
        .then((settings) => {
          configuredAudioSource = settings?.media?.audio_url || null;
          audioSettingsLoaded = true;
          const configuredVolume = Number(settings?.media?.audio_volume);
          if (Number.isFinite(configuredVolume)) {
            configuredDefaultVolume = Math.min(1, Math.max(0, configuredVolume));
            try { if (localStorage.getItem(STORAGE_VOLUME) === null) audio.volume = configuredDefaultVolume; } catch {}
          }
          if (getStoredEnabled() || playRequested) playAudio();
          else kirimStatusAudio("state");
        })
        .catch(() => {
          audioSettingsLoaded = true;
          configuredAudioSource = null;
          if (playRequested) kirimStatusAudio("error");
        });
      const FADE_DURATION_SECONDS = 1.5;
      let fadeAnimationFrame = null;

      function getStoredEnabled() {
        try {
          return localStorage.getItem(STORAGE_ENABLED) === "1";
        } catch {
          return false;
        }
      }

      function aturTersimpanAktif(enabled) {
        try {
          localStorage.setItem(STORAGE_ENABLED, enabled ? "1" : "0");
        } catch {}
      }

      function ambilTersimpanVolume() {
        try {
          const stored = parseFloat(localStorage.getItem(STORAGE_VOLUME));
          if (!Number.isFinite(stored)) return configuredDefaultVolume;
          return Math.min(1, Math.max(0, stored));
        } catch {
          return 0.8;
        }
      }

      function aturTersimpanVolume(value) {
        try {
          localStorage.setItem(STORAGE_VOLUME, String(value));
        } catch {}
      }

      function ambilTersimpanWaktu() {
        try {
          const stored = parseFloat(localStorage.getItem(STORAGE_TIME));
          if (!Number.isFinite(stored) || stored < 0) return 0;
          return stored;
        } catch {
          return 0;
        }
      }

      function aturTersimpanWaktu(value) {
        try {
          localStorage.setItem(STORAGE_TIME, String(value));
        } catch {}
      }

      function fadeVolume(toValue, duration = FADE_DURATION_SECONDS) {
        if (fadeAnimationFrame) {
          cancelAnimationFrame(fadeAnimationFrame);
          fadeAnimationFrame = null;
        }

        const startValue = audio.volume;
        const targetValue = Math.min(1, Math.max(0, toValue));
        const startTime = performance.now();
        const delta = targetValue - startValue;
        if (Math.abs(delta) < 0.001 || duration <= 0) {
          audio.volume = targetValue;
          return;
        }

        function step(now) {
          const progress = Math.min(1, (now - startTime) / (duration * 1000));
          audio.volume = Math.min(
            1,
            Math.max(0, startValue + delta * progress),
          );
          if (progress < 1) {
            fadeAnimationFrame = requestAnimationFrame(step);
          } else {
            fadeAnimationFrame = null;
          }
        }

        fadeAnimationFrame = requestAnimationFrame(step);
      }

      function kirimStatusAudio(eventName) {
        if (!window.parent) return;
        window.parent.postMessage(
          {
            event: eventName || "state",
            sedangBermain: !audio.paused,
            currentTime: audio.currentTime,
            volume: audio.volume,
          },
          location.origin,
        );
      }

      function playAudio() {
        playRequested = true;
        if (!audioSettingsLoaded) return;
        if (!configuredAudioSource) {
          aturTersimpanAktif(false);
          kirimStatusAudio("error");
          return;
        }
        if (!audio.getAttribute("src")) {
          audio.src = configuredAudioSource;
          audio.load();
        }
        if (!audio.paused || playRequestPending) return;
        playRequestPending = true;
        audio
          .play()
          .then(() => {
            playRequestPending = false;
            pendingPlayAfterInteraction = false;
            aturTersimpanAktif(true);
            kirimStatusAudio("play");
          })
          .catch((error) => {
            playRequestPending = false;
            console.error("Audio play failed:", error);
            if (error.name === "NotAllowedError") {
              // Preference remains enabled; retry after a real user interaction.
              pendingPlayAfterInteraction = true;
              aturTersimpanAktif(true);
            }
            kirimStatusAudio("error");
          });
      }

      function pauseAudio() {
        playRequested = false;
        pendingPlayAfterInteraction = false;
        audio.pause();
        aturTersimpanAktif(false);
        kirimStatusAudio("pause");
      }

      function alihAudio() {
        if (audio.paused) {
          playAudio();
        } else {
          pauseAudio();
        }
      }

      function setVolume(value) {
        const normalized = Math.min(1, Math.max(0, Number(value) || 0));
        audio.volume = normalized;
        aturTersimpanVolume(normalized);
        kirimStatusAudio("volume");
      }

      function sendState() {
        kirimStatusAudio("state");
      }

      window.addEventListener("message", (messageEvent) => {
        if (messageEvent.origin !== location.origin || messageEvent.source !== window.parent) return;
        const data = messageEvent.data;
        if (!data || typeof data !== "object") return;

        const action = data.action;
        if (!action) return;

        if (action === "play") {
          playAudio();
        } else if (action === "pause") {
          pauseAudio();
        } else if (action === "toggle") {
          alihAudio();
        } else if (action === "volume") {
          setVolume(data.value);
        } else if (action === "getState") {
          sendState();
        }
      });

      audio.addEventListener("play", () => kirimStatusAudio("play"));
      audio.addEventListener("pause", () => kirimStatusAudio("pause"));
      audio.addEventListener("volumechange", () => {
        // Preferensi volume hanya ditulis saat pengguna mengubahnya melalui setVolume().
        // Dengan begitu volume default CMS tetap dapat diterapkan pada kunjungan pertama.
        kirimStatusAudio("volume");
      });
      audio.addEventListener("timeupdate", () => {
        if (!audio.paused) {
          aturTersimpanWaktu(audio.currentTime);
        }
      });

      window.addEventListener("pagehide", () => {
        aturTersimpanWaktu(audio.currentTime);
        aturTersimpanAktif(!audio.paused);
      });

      audio.addEventListener("error", (e) => {
        console.error("Audio element error:", e);
        kirimStatusAudio("error");
      });

      audio.addEventListener("loadstart", () =>
        console.log("Audio load started"),
      );
      audio.addEventListener("canplay", () => console.log("Audio can play"));
      audio.addEventListener("canplaythrough", () =>
        console.log("Audio can play through"),
      );

      audio.addEventListener("loadedmetadata", () => {
        const storedTime = ambilTersimpanWaktu();
        if (storedTime > 0 && storedTime < audio.duration) {
          audio.currentTime = storedTime;
        }
      });

      window.addEventListener("load", () => {
        audio.volume = ambilTersimpanVolume();
        // Preferensi aktif sebelumnya memulihkan audio; selain itu tidak ada file audio yang diminta.
        sendState();
        if (getStoredEnabled()) playAudio();
      });

      // Keep the retry hooks until playback succeeds. The first user interaction
      // can happen before the settings request finishes, so removing listeners
      // after that event would lose the only reliable autoplay-recovery path.
      function handleUserInteraction() {
        if (!playRequested || !audioSettingsLoaded || !audio.paused) return;
        playAudio();
      }

      audio.addEventListener("playing", () => {
        document.removeEventListener("click", handleUserInteraction);
        document.removeEventListener("keydown", handleUserInteraction);
        document.removeEventListener("touchstart", handleUserInteraction);
      }, { once: true });

      document.addEventListener("click", handleUserInteraction);
      document.addEventListener("keydown", handleUserInteraction);
      document.addEventListener("touchstart", handleUserInteraction);
    </script>
  </body>
</html>
